# docker-compose.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    container_name: fastapi-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    environment:
      - PYTHONUNBUFFERED=1
      - OPENAI_BASE_URL=http://ollama:11434/v1/
      - DATABASE_URL=postgresql+psycopg2://KIR:password@postgres:5432/KirDB
    depends_on:
      - ollama
      - postgres
    networks:
      - ollama-docker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - frontend_node_modules_vite:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama/ollama:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_TRANSFER_STREAMS=1
    restart: unless-stopped
    networks:
      - ollama-docker
    dns:
      - 8.8.8.8
      - 1.1.1.1
  postgres:
    image: postgres:15
    container_name: postgres_dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: KIR
      POSTGRES_PASSWORD: password
      POSTGRES_DB: KirDB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ollama-docker

networks:
  ollama-docker:
    external: false
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  frontend_node_modules_vite:
  postgres_data: